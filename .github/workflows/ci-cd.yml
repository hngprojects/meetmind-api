name: Backend CI/CD

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hngprojects/meetmind-be

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — runs on every PR and push to dev/staging/main
  # Handbook: "CI must pass before merge"
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: ci-test-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_MINUTES: 10080
          APP_BASE_URL: http://localhost:8000
          RESEND_API_KEY: re_test
          EMAIL_FROM: test@test.com
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
        run: uv run pytest

  # ─────────────────────────────────────────────────────────────────────────────
  # Build & Push — only on push (not PRs), only staging and main
  # Handbook: "Every merge to staging/prod should trigger a deployment"
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref != 'refs/heads/dev'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Staging — triggers on merge to staging branch
  # Handbook: "Every merge to staging should trigger a staging deployment"
  # URL: https://api.staging.meetmind.hng14.com
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/meetmind/staging
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            docker compose pull backend
            docker compose up -d --no-deps --force-recreate backend
            docker compose exec -T backend alembic upgrade head
            echo "✅ Staging backend deployed: $IMAGE_TAG"
            docker compose ps

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Production — triggers on merge to main branch
  # Handbook: "Only after successful deployment and validation on staging"
  # URL: https://api.meetmind.hng14.com
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/meetmind/production
            export IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            docker compose pull backend
            docker compose up -d --no-deps --force-recreate backend
            docker compose exec -T backend alembic upgrade head
            echo "✅ Production backend deployed: $IMAGE_TAG"
            docker compose ps