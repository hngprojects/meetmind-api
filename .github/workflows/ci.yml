name: Backend CI

on:
    push:
        branches: [main, staging, dev, "feature/**", "fix/**", "chore/**"]
    pull_request:
        branches: [main, staging, dev]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: Lint, Format, Security & Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:pg15
                env:
                    POSTGRES_USER: ${{ secrets.TEST_POSTGRES_USER || 'postgres' }}
                    POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'postgres' }}
                    POSTGRES_DB: ${{ secrets.TEST_POSTGRES_DB || 'test_db' }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql+asyncpg://${{ secrets.TEST_POSTGRES_USER || 'postgres' }}:${{ secrets.TEST_POSTGRES_PASSWORD || 'postgres' }}@localhost:5432/${{ secrets.TEST_POSTGRES_DB || 'test_db' }}
            APP_BASE_URL: http://localhost:8000
            ENVIRONMENT: test
            JWT_SECRET: ci-test-jwt-secret-key-for-testing-only
            JWT_ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 30
            REFRESH_TOKEN_EXPIRE_MINUTES: 10080
            RESEND_API_KEY: test-resend-api-key
            EMAIL_FROM: test@meetmind.com
            GOOGLE_CLIENT_ID: test-google-client-id
            GOOGLE_CLIENT_SECRET: test-google-client-secret
            GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
            GEMINI_API_KEY: test-gemini-api-key

        steps:
            # ===== BRANCH NAME VALIDATION =====
            - name: Validate branch name
              env:
                  BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  echo "Branch: $BRANCH"
                  if echo "$BRANCH" | grep -Eq '^(main|master|dev(elop)?|staging|hotfix|release)$'; then
                    echo "Allowed base branch: $BRANCH"
                    exit 0
                  fi
                  if echo "$BRANCH" | grep -Eq '^(feat|feature|fix|chore|hotfix|bugfix|docs|refactor)/([A-Za-z]+-[0-9]+(-[a-z0-9-]*)?|[a-z0-9-]+)$'; then
                    echo "Valid feature branch: $BRANCH"
                    exit 0
                  fi
                  echo "❌ Invalid branch name: $BRANCH"
                  echo "Use format: feat/my-feature or fix/bug-description"
                  exit 1

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version"

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: "0.5"
                  enable-cache: true

            - name: Install dependencies (including dev)
              run: uv sync --frozen --dev

            # ===== LINT & FORMAT =====
            - name: Run Ruff lint
              run: uv run ruff check .

            - name: Run Ruff format check
              run: uv run ruff format --check .

            - name: Debug security step
              run: |
                  echo "=== pip-audit raw ==="
                  uv run pip-audit || true

                  echo "=== checking files ==="
                  ls ci/
                  ls security/

            # ===== SECURITY AUDIT =====
            - name: Run security audit (controlled gate)
              run: |
                  echo "🔍 Running security audit..."

                  # Step 1: collect findings only (DO NOT fail here)
                  uv run pip-audit --format json > pip-audit.json || true

                  # Step 2: apply your own policy (THIS is the gate)
                  uv run python ci/security_gate.py \
                    --input pip-audit.json \
                    --exceptions security/vulnerability-exceptions.json

                  EXIT_CODE=$?

                  if [ $EXIT_CODE -ne 0 ]; then
                    echo "❌ Security gate failed"
                    exit 1
                  fi

                  echo "✅ Security gate passed"
            # ===== MIGRATION INTEGRITY =====
            - name: Check for multiple Alembic heads
              run: |
                  HEAD_COUNT=$(uv run alembic heads 2>/dev/null | wc -l)
                  if [ "$HEAD_COUNT" -gt 1 ]; then
                    echo "❌ Multiple Alembic heads detected — merge your migrations!"
                    uv run alembic heads
                    exit 1
                  fi
                  echo "✅ Single Alembic head confirmed"

            - name: Run migrations
              run: uv run alembic upgrade head

            # ===== TESTS =====
            - name: Run tests
              run: uv run pytest tests/ --tb=short -v

            # ===== JOB SUMMARY =====
            - name: Job Summary
              if: always()
              run: |
                  echo "## 🚀 Backend CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- **Result**: ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Branch validation | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Ruff lint | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Ruff format | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Security audit | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Alembic heads | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Migrations | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "---" >> $GITHUB_STEP_SUMMARY
                  echo "_Completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")_" >> $GITHUB_STEP_SUMMARY
