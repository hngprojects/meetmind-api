[project]
name = "meetmind"
version = "0.1.0"
description = "FastAPI + Postgres starter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "bcrypt>=4.0.0",
    "cryptography>=44.0.1",
    "psycopg2-binary>=2.9.12",
    "python-decouple>=3.8",
    "resend>=2.30.0",
    "Jinja2>=3.1.0",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
    "mako>=1.3.12",
    "redis>=7.4.0",
    "urllib3>=2.7.0",
    "livekit-api>=0.4.1",
    "livekit-agents>=0.8.4",
    "livekit-plugins-silero>=0.4.1",
    "livekit-plugins-turn-detector>=0.1.2",
    "aiohttp>=3.10.0",
    "rtms==1.1.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "pgvector>=0.4.2",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "langchain-text-splitters>=1.1.2",
    "google-genai>=2.4.0",
    "idna>=3.15",
    "pyjwt[crypto]>=2.12.1",
    "openai>=2.38.0",
    "groq>=1.2.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-exporter-otlp",
    "opentelemetry-sdk-extension-logging",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "pip-audit>=2.10.0",
]

[tool.ruff]
exclude = [
    ".venv",
    "alembic/versions/**",
    "alembic/env.py",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
